# This workflow belongs at the ROOT of the future standalone support repository.
# It is intentionally nested under website/ in the private App repository.
name: Publish FrameLive support
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'verify_public.py'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'wpowen/framelive-support' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public files only (no private App dependency)
        run: python3 -B verify_public.py public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
